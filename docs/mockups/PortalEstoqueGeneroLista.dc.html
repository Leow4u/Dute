<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F5F7;color:#1E293B;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#2457D6;text-decoration:none}a:hover{color:#1C45AB}
h1,h2,p{margin:0}
button{font-family:inherit}
.ic{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:#5D6877}
.card{background:#fff;border:1px solid #E2E6EB;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{height:44px;padding:0 16px;text-align:left;font-size:12px;font-weight:600;color:#5D6877;border-bottom:1px solid #E2E6EB;white-space:nowrap}
td{padding:12px 16px;vertical-align:middle;border-top:1px solid #E2E6EB}
tr:first-child td{border-top:0}
.r{text-align:right}
.code{font-weight:500}
.ttl{background:none;border:0;padding:0;font-size:14px;font-weight:500;color:#1E293B;cursor:pointer;text-align:left}
.type{font-size:12px;color:#5D6877;margin-left:8px}
.gc{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:6px;border:1px solid transparent;font-size:10px;font-weight:800;letter-spacing:.05em;margin-left:8px;vertical-align:middle}
.gc .ic{width:12px;height:12px;stroke-width:2.4}
.g-fem{background:#FCE7F3;border-color:#F3B4D3;color:#9D174D}
.g-masc{background:#CCFBF1;border-color:#8FE0D0;color:#115E59}
.sb{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:6px;background:#fff;font-size:12px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sb .ic{width:14px;height:14px}
.sb-low{color:#8A6A22}.sb-zero{color:#BF1247}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-p{background:#2457D6;color:#fff}
.btn-o{background:#fff;color:#1E293B;border-color:#E2E6EB}
.btn-g{background:transparent;color:#5D6877}
.step{display:inline-flex;align-items:center;height:36px;border:1px solid #E2E6EB;border-radius:6px;background:#fff;overflow:hidden}
.step button{width:34px;height:34px;border:0;background:#fff;color:#1E293B;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.step output{min-width:36px;text-align:center;font-size:14px;font-weight:600}
.acts{display:flex;justify-content:flex-end;gap:8px}
</style>
