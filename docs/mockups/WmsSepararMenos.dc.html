<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Separar · separar menos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F5F5F3;color:#161616;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
a{color:#0054CE}a:hover{color:#003E99}
x-dc{display:contents}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-size:22px;font-weight:800}
.dlg .sub{font-size:13.5px;color:#5F6368;font-weight:600;margin-top:4px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fs legend{font-size:13.5px;font-weight:700;padding:0}
.fs{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:10px}
.op label{flex:1;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid #D4D4CF;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.op label.on{border-color:#161616;box-shadow:inset 0 0 0 1px #161616}
.op input{accent-color:#161616;width:16px;height:16px;margin:0}
.inp{height:44px;border:1px solid #D4D4CF;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;width:100%}
.stp{display:inline-flex;align-items:stretch;height:44px;border:1px solid #D4D4CF;border-radius:8px;overflow:hidden;background:#fff;width:fit-content}
.stp button{width:44px;border:0;background:#fff;font:800 16px Manrope,sans-serif;color:#161616;cursor:pointer}
.stp output{min-width:56px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;border-left:1px solid #E5E5E1;border-right:1px solid #E5E5E1}
.ft{display:flex;justify-content:flex-end;gap:10px}
.b{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:8px;font:700 14px Manrope,sans-serif;border:1px solid #D4D4CF;background:#fff;color:#161616;cursor:pointer}
.b.p{background:#E71C23;border-color:#E71C23;color:#fff}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden">
  <div style="position:absolute;top:0;left:0;width:1440px;height:900px"><dc-import name="WmsSepararBancada" hint-size="1440px,900px"></dc-import></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(22,22,22,.45)"></div>
  <section class="dlg" role="dialog" aria-modal="true" aria-labelledby="sm-titulo">
    <div>
      <h2 id="sm-titulo">Separar menos</h2>
      <p class="sub">Lancheira Grande AZ · B-09 · pedido 2 un.</p>
    </div>
    <div class="fld">
      <label id="sm-sep">Separado</label>
      <div class="stp" role="group" aria-labelledby="sm-sep"><button type="button" aria-label="Menos um">−</button><output aria-label="Separado de Lancheira Grande AZ">1</output><button type="button" aria-label="Mais um">+</button></div>
    </div>
    <fieldset class="fs">
      <legend>Motivo da diferença</legend>
      <div class="op">
        <label><input type="radio" name="motivo" value="falta">Falta</label>
        <label class="on"><input type="radio" name="motivo" value="avaria" checked>Avaria</label>
      </div>
    </fieldset>
    <div class="fld">
      <label for="sm-det">Detalhe</label>
      <input class="inp" id="sm-det" type="text" value="1 com o zíper quebrado">
    </div>
    <div class="ft"><button type="button" class="b">Voltar</button><button type="button" class="b p">Registrar diferença</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
