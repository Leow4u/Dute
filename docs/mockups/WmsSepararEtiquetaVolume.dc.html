<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Etiqueta do volume</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E8E8E4;color:#161616;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;width:860px;height:470px;overflow:hidden;display:flex;align-items:center;justify-content:center}
a{color:#0054CE}a:hover{color:#003E99}
x-dc{display:contents}
.lab{width:812px;height:406px;background:#fff;border:1px solid #CFCFCA;border-radius:4px;padding:22px 26px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.cap{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#5F6368}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:42px;font-weight:700;line-height:1.05;letter-spacing:.02em}
.vol{font-size:66px;font-weight:800;line-height:1}
.vol small{font-size:34px;font-weight:700}
.bc{height:72px;background:repeating-linear-gradient(90deg,#161616 0 3px,#fff 3px 5px,#161616 5px 7px,#fff 7px 12px,#161616 12px 14px,#fff 14px 16px,#161616 16px 21px,#fff 21px 24px)}
.inf{display:flex;justify-content:space-between;gap:24px;font-size:18px}
.ct{flex:1;border-top:1.5px solid #161616;padding-top:6px;font-size:18px;line-height:1.35}
.ct span{color:#3F403F}
.ft{display:flex;justify-content:space-between;font-size:19px;font-weight:700}
</style>
</helmet>
<div class="lab">
  <div class="top">
    <div><div class="cap">Pedido</div><div class="mono">PED-0001</div></div>
    <div style="text-align:right"><div class="cap">Volume</div><div class="vol">12 <small>de 42</small></div></div>
  </div>
  <div class="bc" role="img" aria-label="Código de barras PED-0001-V12"></div>
  <div class="inf"><span>BTG Pactual · Agência Faria Lima</span><span>12/11/2026 · 11,6 kg</span></div>
  <div class="ct">
    <div><b>30 ×</b> Calça Social Masculino Preta · 40 <span>· A.01.0712.001.40</span></div>
    <div><b>12 ×</b> Calça Social Masculino Preta · 42 <span>· A.01.0712.001.42</span></div>
  </div>
  <div class="ft"><span>Dutelog</span><span>42 un.</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":470}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
