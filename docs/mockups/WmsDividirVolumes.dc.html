<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dividir em volumes · pronto para confirmar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F5F5F3;color:#161616;font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
a{color:#0054CE}a:hover{color:#003E99}
x-dc{display:contents}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-s{width:16px;height:16px;flex:0 0 auto}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-height:85%;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35);padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.dlg h2{font-size:22px;font-weight:800}
.dlg .sub{font-size:13.5px;color:#5F6368;font-weight:600;margin-top:4px}
.cxs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.cx{display:inline-block;font:600 12.5px ui-monospace,Menlo,Consolas,monospace;background:#E3ECFB;color:#1E4E9C;border-radius:6px;padding:3px 7px;white-space:nowrap}
.bx{flex:0 0 auto;border:1px solid #E5E5E1;border-radius:12px;overflow:hidden}
.br{display:grid;grid-template-columns:minmax(0,1fr) 144px 104px 40px;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #F0F0ED}
.br.u{border-bottom:0}
.br.h{padding:7px 16px;background:#FAFAF8;font-size:12.5px;font-weight:700;color:#5F6368}
.br.h .c2{grid-column:2;text-align:center}
.br .t{min-width:0}
.br .t b{display:block;font-weight:700;font-size:15px}
.br .t b.ab{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.br .t>span{display:block;font-size:13px;color:#5F6368}
.stp{display:flex;align-items:stretch;height:40px;border:1px solid #D4D4CF;border-radius:8px;overflow:hidden;background:#fff}
.stp button{flex:0 0 40px;width:40px;padding:0;border:0;background:#fff;font:800 16px Manrope,sans-serif;color:#161616;cursor:pointer}
.stp button[disabled]{opacity:.45;cursor:default}
.stp input{flex:1 1 auto;width:100%;min-width:0;padding:0;border:0;border-left:1px solid #E5E5E1;border-right:1px solid #E5E5E1;background:#fff;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.stp button:focus-visible,.stp input:focus-visible{outline:2px solid #161616;outline-offset:-2px}
.rs{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.inp{height:40px;border:1px solid #D4D4CF;border-radius:8px;background:#fff;padding:0 12px;font-size:14px;width:100%}
.inp[aria-invalid="true"]{border-color:#8E1016;box-shadow:0 0 0 1px #8E1016}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent;letter-spacing:0}
.s-amb{background:#FDF0D5;border-color:#F3DCA3;color:#8A4B00}
.ft{display:flex;justify-content:flex-end;gap:10px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;font:700 14px Manrope,sans-serif;border:1px solid #D4D4CF;background:#fff;color:#161616;cursor:pointer;white-space:nowrap}
.b.p{background:#E71C23;border-color:#E71C23;color:#fff}
.b[disabled]{opacity:.45;cursor:default}
.b.sm{align-self:flex-start;flex:0 0 auto;height:36px;padding:0 14px;font-size:13.5px}
.b.i{display:flex;width:40px;padding:0}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden">
  <div style="position:absolute;top:0;left:0;width:1440px;height:900px;z-index:0"><dc-import name="WmsDividirBancada" hint-size="1440px,900px"></dc-import></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(22,22,22,.45)"></div>
  <section class="dlg" role="dialog" aria-modal="true" aria-labelledby="dv-titulo">
    <div>
      <h2 id="dv-titulo">Dividir em volumes</h2>
      <p class="sub">Polo Masculino Piquet Preto · M · A-07 · 95 un.</p>
      <div class="cxs"><span class="cx">54 de CX-000218</span><span class="cx">41 de CX-000219</span></div>
    </div>
    <div class="bx">
      <div class="br h" aria-hidden="true"><span class="c2">Un.</span><span>Peso (kg)</span></div>
      <sc-for list="{{linhas}}" as="linha" hint-placeholder-count="1">
        <div class="br">
          <div class="t"><b id="dv-v{{linha.numero}}">Volume {{linha.numero}}</b><span>{{linha.texto}}</span></div>
          <div class="stp" role="group" aria-labelledby="dv-v{{linha.numero}}"><button type="button" aria-label="Menos um no volume {{linha.numero}}" disabled="{{linha.semMenos}}" onClick="{{linha.menos}}">−</button><input type="text" inputmode="numeric" aria-label="Separado no volume {{linha.numero}}" value="{{linha.valor}}" onChange="{{linha.digitar}}" onBlur="{{linha.normalizar}}"><button type="button" aria-label="Mais um no volume {{linha.numero}}" disabled="{{linha.semMais}}" onClick="{{linha.mais}}">+</button></div>
          <input class="inp" id="peso-v{{linha.numero}}" type="text" inputmode="decimal" aria-label="Peso do volume {{linha.numero}} (kg)" aria-invalid="{{linha.pesoInvalido}}" value="{{linha.peso}}" onChange="{{linha.pesar}}">
          <sc-if value="{{linha.removivel}}" hint-placeholder-val="{{false}}"><button type="button" class="b i" aria-label="Tirar o volume {{linha.numero}}" onClick="{{linha.tirar}}"><svg class="ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></sc-if>
        </div>
      </sc-for>
      <div class="br u">
        <div class="t"><b class="ab" id="dv-v{{numeroResto}}">Volume {{numeroResto}}<span class="badge s-amb">aberto</span></b></div>
        <div class="stp" role="group" aria-labelledby="dv-v{{numeroResto}}"><button type="button" aria-label="Menos um no volume {{numeroResto}}" disabled="{{restoSemMenos}}" onClick="{{restoMenos}}">−</button><input type="text" inputmode="numeric" aria-label="Separado no volume {{numeroResto}}" value="{{restoValor}}" onChange="{{restoDigitar}}" onBlur="{{restoNormalizar}}"><button type="button" aria-label="Mais um no volume {{numeroResto}}" disabled="{{restoSemMais}}" onClick="{{restoMais}}">+</button></div>
      </div>
    </div>
    <button type="button" class="b sm" disabled="{{semMaisUm}}" onClick="{{maisUm}}"><svg class="ic-s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Mais um volume</button>
    <div class="ft"><button type="button" class="b">Voltar</button><button type="button" class="b p" disabled="{{primarioOff}}">Separar em {{volumes}} volumes</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  parametros() {
    return { TOTAL: 95, ABERTO: 16, TEM: 0, PESO: true, QTDS: [54], PESOS: ['10,8'] };
  }
  estado() {
    const p = this.parametros();
    const s = this.state || {};
    const qtds = Array.isArray(s.qtds) ? s.qtds : p.QTDS;
    const textos = Array.isArray(s.textos) ? s.textos : qtds.map(() => null);
    const pesos = Array.isArray(s.pesos) ? s.pesos : p.PESOS;
    const textoResto = typeof s.textoResto === 'string' ? s.textoResto : null;
    return { qtds: qtds.slice(), textos: textos.slice(), pesos: pesos.slice(), textoResto: textoResto };
  }
  mudar(fn) {
    const n = this.estado();
    if (fn(n) === false) return;
    this.setState({ qtds: n.qtds, textos: n.textos, pesos: n.pesos, textoResto: n.textoResto });
  }
  definir(n, i, q) {
    const soma = n.qtds.reduce((a, b) => a + b, 0);
    const maximo = this.parametros().TOTAL - (soma - n.qtds[i]) - 1;
    n.qtds[i] = Math.max(1, Math.min(maximo, q));
  }
  passo(i, d) {
    this.mudar((n) => {
      if (i >= n.qtds.length) return false;
      this.definir(n, i, n.qtds[i] + d);
      n.textos[i] = null;
      n.textoResto = null;
    });
  }
  digitar(i, valor) {
    const digitos = String(valor == null ? '' : valor).replace(/\D/g, '');
    this.mudar((n) => {
      if (i >= n.qtds.length) return false;
      n.textos[i] = digitos;
      n.textoResto = null;
      const q = parseInt(digitos, 10);
      if (q >= 1) this.definir(n, i, q);
    });
  }
  normalizar(i) {
    this.mudar((n) => {
      if (n.textos[i] == null) return false;
      n.textos[i] = null;
    });
  }
  definirResto(n, q) {
    const k = n.qtds.length - 1;
    const resto = this.parametros().TOTAL - n.qtds.reduce((a, b) => a + b, 0);
    const novo = Math.max(1, Math.min(resto + n.qtds[k] - 1, q));
    n.qtds[k] = n.qtds[k] + resto - novo;
  }
  passoResto(d) {
    const total = this.parametros().TOTAL;
    this.mudar((n) => {
      const resto = total - n.qtds.reduce((a, b) => a + b, 0);
      this.definirResto(n, resto + d);
      n.textos[n.qtds.length - 1] = null;
      n.textoResto = null;
    });
  }
  digitarResto(valor) {
    const digitos = String(valor == null ? '' : valor).replace(/\D/g, '');
    this.mudar((n) => {
      n.textoResto = digitos;
      n.textos[n.qtds.length - 1] = null;
      const q = parseInt(digitos, 10);
      if (q >= 1) this.definirResto(n, q);
    });
  }
  normalizarResto() {
    this.mudar((n) => {
      if (n.textoResto == null) return false;
      n.textoResto = null;
    });
  }
  pesar(i, valor) {
    this.mudar((n) => {
      if (i >= n.pesos.length) return false;
      n.pesos[i] = String(valor == null ? '' : valor);
    });
  }
  maisUm() {
    const total = this.parametros().TOTAL;
    this.mudar((n) => {
      const resto = total - n.qtds.reduce((a, b) => a + b, 0);
      if (resto < 2 || n.qtds.length + 1 >= 20) return false;
      const acima = n.qtds[n.qtds.length - 1];
      n.qtds.push(acima <= resto - 1 ? acima : Math.floor(resto / 2));
      n.textos.push(null);
      n.pesos.push('');
      n.textoResto = null;
    });
  }
  tirar(i) {
    this.mudar((n) => {
      if (i < 1 || i >= n.qtds.length) return false;
      n.qtds.splice(i, 1);
      n.textos.splice(i, 1);
      n.pesos.splice(i, 1);
      n.textoResto = null;
    });
  }
  pesoValido(valor) {
    const texto = String(valor == null ? '' : valor).trim();
    if (texto === '') return true;
    const ponto = texto.replace(',', '.');
    if (!/^\d+(\.\d{1,3})?$/.test(ponto)) return false;
    const kg = parseFloat(ponto);
    return kg > 0 && kg <= 2000;
  }
  renderVals() {
    const p = this.parametros();
    const e = this.estado();
    const un = (v) => v.toLocaleString('pt-BR') + ' un.';
    const resto = p.TOTAL - e.qtds.reduce((a, b) => a + b, 0);
    let pesoInvalido = false;
    const linhas = e.qtds.map((q, i) => {
      const valido = !p.PESO || this.pesoValido(e.pesos[i]);
      if (!valido) pesoInvalido = true;
      return {
        numero: p.ABERTO + i,
        texto: i === 0 && p.TEM > 0 ? 'tem ' + un(p.TEM) + ' · fecha com ' + un(p.TEM + q) : 'fecha',
        valor: e.textos[i] != null ? e.textos[i] : String(q),
        semMenos: q <= 1,
        semMais: resto <= 1,
        menos: () => this.passo(i, -1),
        mais: () => this.passo(i, 1),
        digitar: (ev) => this.digitar(i, ev.target.value),
        normalizar: () => this.normalizar(i),
        peso: e.pesos[i] || '',
        pesar: (ev) => this.pesar(i, ev.target.value),
        pesoInvalido: valido ? 'false' : 'true',
        removivel: i >= 1,
        tirar: () => this.tirar(i)
      };
    });
    return {
      linhas: linhas,
      numeroResto: p.ABERTO + e.qtds.length,
      restoValor: e.textoResto != null ? e.textoResto : String(resto),
      restoSemMenos: resto <= 1,
      restoSemMais: e.qtds[e.qtds.length - 1] <= 1,
      restoMenos: () => this.passoResto(-1),
      restoMais: () => this.passoResto(1),
      restoDigitar: (ev) => this.digitarResto(ev.target.value),
      restoNormalizar: () => this.normalizarResto(),
      semMaisUm: resto < 2 || e.qtds.length + 1 >= 20,
      maisUm: () => this.maisUm(),
      volumes: e.qtds.length + 1,
      primarioOff: pesoInvalido
    };
  }
}
</script>
</body>
</html>
