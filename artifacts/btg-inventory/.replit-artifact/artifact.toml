kind = "web"
previewPath = "/"
title = "BTG Inventário"
version = "1.0.0"
id = "artifacts/btg-inventory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20784

[services.development]
run = "pnpm --filter @workspace/btg-inventory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/btg-inventory", "run", "build" ]
serve = "static"
publicDir = "artifacts/btg-inventory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20784"
BASE_PATH = "/"
