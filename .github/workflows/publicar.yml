name: Publicar

# Publica um ambiente (homologação ou produção). Chamado pelo ci.yml depois
# dos testes: homologação a cada push na main, produção só por disparo manual.
# Em série: confere se o commit ainda é o da main, regras e índices, functions
# e por último o frontend, para a tela nova nunca chegar antes da callable que
# ela chama.
#
# Uma publicação por ambiente de cada vez: o ci.yml chama este workflow com
# concurrency "publicar-<ambiente>" e cancel-in-progress: false. Até 20/10/2026
# cada job tinha o próprio grupo com cancel-in-progress: true, e o push seguinte
# cancelou duas vezes no mesmo dia o "firebase deploy --only functions" da
# homologação no meio (merges do #106 e do #110), pulando a conferência do
# invoker. Agora a publicação em andamento termina; quem chega depois espera, e
# o GitHub mantém só a mais nova na espera.
on:
  workflow_call:
    inputs:
      ambiente:
        description: "homologacao ou producao"
        type: string
        required: true
      project_id:
        type: string
        required: true
      project_number:
        type: string
        required: true
      service:
        description: "Serviço do Cloud Run do frontend"
        type: string
        required: true
      repository:
        description: "Repositório do Artifact Registry"
        type: string
        required: true
      public_url:
        description: "Endereço público conferido além do run.app (vazio = só o run.app)"
        type: string
        default: ""
      firebase_api_key:
        type: string
        required: true
      firebase_app_id:
        type: string
        required: true

env:
  REGION: southamerica-east1

jobs:
  # A fila de concorrência não garante que o commit mais novo publique por
  # último: os testes de dois pushes seguidos podem terminar fora de ordem, e o
  # pendente mais antigo entra depois do mais novo. Por isso a publicação só
  # começa se este commit ainda for o HEAD da main. Na homologação, se a main
  # já andou, nada sobe e o run fica verde com aviso: a execução do commit novo
  # é que publica. Na produção, falha: o disparo foi para um commit que já não
  # é o da main, e a conferência na homologação é a do commit novo.
  head-da-main:
    name: Commit ainda é o HEAD da main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publicar: ${{ steps.conferir.outputs.publicar }}
    steps:
      - id: conferir
        env:
          GH_TOKEN: ${{ github.token }}
          AMBIENTE: ${{ inputs.ambiente }}
        run: |
          set -euo pipefail
          HEAD_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "${HEAD_MAIN}" = "${GITHUB_SHA}" ]; then
            echo "publicar=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${AMBIENTE}" = "producao" ]; then
            echo "::error::A main está em ${HEAD_MAIN:0:7}, não mais em ${GITHUB_SHA:0:7}. Confira ${HEAD_MAIN:0:7} na homologação e dispare a produção de novo."
            exit 1
          fi
          echo "::notice::${GITHUB_SHA:0:7} não é mais o HEAD da main (${HEAD_MAIN:0:7}); a homologação fica para a execução de ${HEAD_MAIN:0:7}."
          echo "publicar=false" >> "${GITHUB_OUTPUT}"

  # Regras do Firestore e do Storage e índices do Firestore. As functions e o
  # frontend dependem deste job: em 16/10/2026 os dois subiram sem as regras
  # novas e a tela Estoque › Posições ficou em "Missing or insufficient
  # permissions" até alguém publicar as regras à mão. Usa a conta do job de
  # functions, que tem firebase.viewer (acha o banco e o bucket padrão),
  # firebaserules.admin e datastore.indexAdmin (ver docs/deploy-functions-manual.md).
  regras:
    name: Regras e índices (Firestore e Storage)
    needs: head-da-main
    if: needs.head-da-main.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-functions@${{ inputs.project_id }}.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Sem --force: índice que existe no projeto e não está no
      # firestore.indexes.json só gera aviso no log, o CI nunca apaga índice.
      - name: Publicar regras e índices
        run: firebase deploy --only firestore,storage --project "${PROJECT_ID}" --non-interactive

      # Os índices novos ficam construindo por alguns minutos depois do deploy;
      # as regras valem na hora, então é delas que se confere o conteúdo.
      - name: Conferir as regras publicadas
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: bash tools/check_rules_deployed.sh "${PROJECT_ID}"

  functions:
    name: Cloud Functions
    needs: regras
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-functions@${{ inputs.project_id }}.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/wms/package-lock.json
            functions/comercial/package-lock.json
            functions/operacao/package-lock.json

      # O predeploy de cada codebase (firebase.json) roda tsc na pasta dela, que
      # precisa do node_modules local.
      - name: Install functions deps
        working-directory: functions/wms
        run: npm ci

      - name: Install functions deps (Comercial)
        working-directory: functions/comercial
        run: npm ci

      - name: Install functions deps (Operação)
        working-directory: functions/operacao
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 02/10/2026: a API do Cloud Scheduler estava desligada e 4 callables novas
      # (rotinas do Agent Dute) ficaram com deploy falho — a onSchedule precisa
      # dela. Os projetos já a têm ativa; isso é só rede de segurança pra um
      # projeto novo. 16/10/2026: a SA github-actions-functions não tem
      # serviceusage.services.enable (só serviceUsageConsumer, que é pra
      # *usar* serviço já ativo, não ativar um novo) — dar serviceUsageAdmin só
      # pra isso seria mais privilégio do que vale a pena; não trava o job se
      # falhar, o `firebase deploy` já falha sozinho se a API estiver desligada.
      - name: Garantir API do Cloud Scheduler ativa
        continue-on-error: true
        run: gcloud services enable cloudscheduler.googleapis.com --project "${PROJECT_ID}"

      # Sempre o lote inteiro (todas as codebases do firebase.json: "default", o
      # WMS, "comercial" e "operacao"), nunca "firebase deploy --only functions:nome": foi
      # deploy parcial que causou o incidente de 03/09/2026 (8 callables sem
      # invoker, um mês sem ninguém perceber). Timeout de descoberta já subido de
      # cara — na máquina do Leonardo precisou de 60-180s dependendo do dia (ver
      # docs/deploy-functions-manual.md); o runner do CI é uma máquina
      # desconhecida, sem alguém olhando pra tentar de novo com um valor maior.
      # firebase.json fica na raiz do repo (não em functions/wms/) — é de lá que o
      # firebase deploy precisa rodar, igual no roteiro manual.
      - name: Publicar todas as functions
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: "180"
        run: firebase deploy --only functions --project "${PROJECT_ID}" --non-interactive

      # Não autocorrige — só falha e avisa. O incidente de 03/09/2026 ficou um mês
      # sem ninguém perceber justamente porque nada conferia isso depois do
      # deploy; o script sugere o "gcloud run services add-iam-policy-binding"
      # certo, mas quem aplica é uma pessoa (ver docs/deploy-functions-manual.md).
      - name: Verificar invocação pública de cada callable
        shell: pwsh
        run: ./tools/check_functions_invoker.ps1 -ProjectId "${env:PROJECT_ID}"

  # Por último: até 20/10/2026 o frontend subia junto com as functions e ficava
  # uns 5 minutos no ar chamando as functions antigas. Se as functions ou a
  # conferência do invoker falham, o frontend não sobe.
  frontend:
    name: Frontend (Cloud Run)
    needs: [regras, functions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      SERVICE: ${{ inputs.service }}
      REPOSITORY: ${{ inputs.repository }}
      PUBLIC_URL: ${{ inputs.public_url }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@${{ inputs.project_id }}.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # O build precisa da configuração web do Firebase (VITE_FIREBASE_*). Na máquina
      # do Leonardo ela vem do .env.local da raiz (envDir do vite.config.ts); aqui
      # vem do ci.yml. São os valores públicos que vão em todo bundle servido
      # ao navegador: a chave de API web do Firebase não é segredo, o acesso é
      # controlado por Rules e backend. Em 09/10/2026 um build sem elas foi
      # publicado e o login parou com "Firebase não configurado"; por isso a trava
      # no fim do passo. Segredos de verdade (AGENT_DUTE_*) nunca entram aqui.
      - name: Install and build frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ inputs.firebase_api_key }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ inputs.project_id }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ inputs.project_id }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ inputs.project_id }}.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.project_number }}
          VITE_FIREBASE_APP_ID: ${{ inputs.firebase_app_id }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@workspace/app" run build
          if ! grep -q "${VITE_FIREBASE_AUTH_DOMAIN}" artifacts/app/dist/public/assets/*.js; then
            echo "::error::O build saiu sem a configuração do Firebase (VITE_FIREBASE_*); não vai subir."
            exit 1
          fi

      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dute-browser-smoke" --no-audit --no-fund --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/dute-browser-smoke/node_modules/playwright/cli.js" install --with-deps chromium

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      # A imagem é montada aqui no runner e enviada direto ao Artifact Registry.
      # `gcloud builds submit` precisava do bucket <projeto>_cloudbuild e falhava
      # com "forbidden from accessing the bucket" mesmo com os papéis certos
      # (ver docs/deploy-manual.md); sem Cloud Build, bastam artifactregistry.writer
      # e run.admin, que a conta de serviço já tem.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image and deploy to Cloud Run
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/cloud-run-src"
          mkdir -p "${STAGE_DIR}/deploy/cloud-run"
          mkdir -p "${STAGE_DIR}/artifacts/app/dist"
          cp Dockerfile "${STAGE_DIR}/"
          cp deploy/cloud-run/nginx.conf "${STAGE_DIR}/deploy/cloud-run/"
          cp -r artifacts/app/dist/public "${STAGE_DIR}/artifacts/app/dist/"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${SHORT_SHA}"

          docker build --tag "${IMAGE}" "${STAGE_DIR}"
          docker push "${IMAGE}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --project "${PROJECT_ID}"

          gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format "value(status.url)"

      # Em 09/10/2026, oito execuções seguidas deste job terminaram verdes sem mudar
      # o que a produção servia: todas imprimiram a mesma revisão
      # (dute-btg-app-00143-loc) e o app continuou no build de 08/10: o tráfego
      # estava preso nessa revisão e as novas ficaram com 0%. Por isso a
      # publicação só conta quando o index.html servido referencia os assets do build
      # que acabamos de montar; se não bater, o job falha e mostra o tráfego e as
      # últimas revisões do serviço para diagnóstico.
      - name: Verify the service is serving this build
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          URLS=("${SERVICE_URL}")
          if [ -n "${PUBLIC_URL}" ]; then URLS+=("${PUBLIC_URL}"); fi
          if ! bash tools/check_frontend_deployed.sh artifacts/app/dist/public/index.html "${URLS[@]}"; then
            echo "Tráfego e revisões do serviço:"
            gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
              --format "yaml(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,spec.traffic)"
            gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 5 \
              --format "table(name,creationTimestamp.date('%Y-%m-%d %H:%M'),active,spec.containers[0].image)"
            exit 1
          fi

      # Os hashes corretos não garantem que o JavaScript consiga inicializar.
      - name: Verify deployed login starts in Chromium
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          URLS=("${SERVICE_URL}")
          if [ -n "${PUBLIC_URL}" ]; then URLS+=("${PUBLIC_URL}"); fi
          STARTUP_INDEX=0
          for STARTUP_URL in "${URLS[@]}"; do
            SMOKE_TOOL_DIR="$RUNNER_TEMP/dute-browser-smoke" node tools/check_frontend_startup.cjs "$STARTUP_URL" "$RUNNER_TEMP/dute-deployed-startup/$STARTUP_INDEX"
            STARTUP_INDEX=$((STARTUP_INDEX + 1))
          done

      - name: Upload deployed startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-startup-${{ inputs.ambiente }}
          path: ${{ runner.temp }}/dute-deployed-startup
          retention-days: 7
