name: Homologação

# Cada push na main publica na homologação (dute-homolog) quando o CI desse
# commit termina verde. O gatilho é workflow_run, não uma espera com runner
# parado: o CI roda sozinho e este workflow só nasce no fim.
#
# Uma publicação por vez, sem cancelar a que está rodando (cancel-in-progress:
# false; um "firebase deploy" cortado no meio deixa functions pela metade). O
# GitHub guarda só uma execução pendente no grupo. Se o CI de um commit mais
# antigo termina por último e tira da fila o do HEAD, o passo --sha publica o
# HEAD se o CI dele já está verde (tools/esperar_ci.py). Commit que não é o
# HEAD e cujo HEAD ainda não tem CI verde sai sem publicar.
#
# Até 22/10/2026 a fila era do job de publicação do ci.yml, que só entrava nela
# quando os testes acabavam, fora de ordem. Até esta troca, o homologacao.yml
# nascia no push e ficava até 50 min parado em tools/esperar_ci.py.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: publicar-homologacao
  cancel-in-progress: false

jobs:
  escolher:
    name: Commit a publicar
    # workflow_run também nasce de PR e de CI vermelho. Só o push na main,
    # verde, segue. Disparo manual do CI não publica (o evento não é push).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.decidir.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: decidir
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/esperar_ci.py --sha

  publicar:
    name: Publicar na homologação
    needs: escolher
    if: needs.escolher.outputs.sha != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publicar.yml
    with:
      ambiente: homologacao
      project_id: dute-homolog
      project_number: "368642218894"
      service: dute-app
      repository: dute
      firebase_api_key: "AIzaSyBPaH5X0wHbF_geH1zit0rwyJWmdb3Q7Ds"
      firebase_app_id: "1:368642218894:web:13790f72c76fbb21af22df"
      commit_sha: ${{ needs.escolher.outputs.sha }}
