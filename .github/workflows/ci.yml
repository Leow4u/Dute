name: CI

on:
  push:
    branches: [main, master, codex/ai-native-foundation]
  pull_request:
  # Publicação manual do frontend a partir de main (Actions > CI > Run workflow).
  # Marcar "liberar_trafego" solta o tráfego do Cloud Run para a última revisão
  # pronta (--to-latest); é o que desfaz um rollback feito com --to-revisions.
  workflow_dispatch:
    inputs:
      liberar_trafego:
        description: "Mudar o tráfego do dute-btg-app: 100% para a última revisão pronta (--to-latest), ou para a revisão informada abaixo"
        type: boolean
        default: false
      revisao:
        description: "Opcional, para rollback: nome da revisão que recebe 100% do tráfego (ex.: dute-btg-app-00143-loc). Vazio = última revisão pronta."
        type: string
        default: ""

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/btg-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        working-directory: .
        run: pnpm install --frozen-lockfile
      # O typecheck do root roda tsc --build primeiro, gerando os .d.ts de
      # lib/api-client-react que o app referencia — sem isso o checkout limpo
      # do CI falha com TS6305 e uma cascata de implicit any.
      - name: Typecheck workspace
        working-directory: .
        run: pnpm run typecheck
      - name: Frontend unit tests
        run: pnpm run test

  functions-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions deps
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Testes do check_functions_invoker.ps1
        working-directory: .
        shell: pwsh
        run: ./tools/check_functions_invoker.tests.ps1

  tools-python-tests:
    name: Testes das ferramentas Python (tools/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Zeragem total (tools/full_reset_btg.py) e helpers de backup: só stdlib.
      - name: Unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

  functions-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install functions deps
        run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Integration + rules tests
        run: npm run test:integration

  deploy-frontend:
    name: Deploy frontend (Cloud Run)
    runs-on: ubuntu-latest
    # CI verde antes de publicar (frontend-typecheck, functions-unit e
    # functions-integration). Antes só frontend-typecheck travava o deploy: um
    # push que quebrasse os testes de functions publicava o frontend assim mesmo.
    needs: [frontend-typecheck, functions-unit, functions-integration]
    # Só main publica: push mergeado ou disparo manual.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-btg
      REGION: southamerica-east1
      SERVICE: dute-btg-app
      REPOSITORY: dute-btg
      PUBLIC_URL: https://app.dutelog.com.br
      WORKLOAD_IDENTITY_PROVIDER: projects/912453685006/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@dute-btg.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # O build precisa da configuração web do Firebase (VITE_FIREBASE_*). Na máquina
      # do Leonardo ela vem do .env.local da raiz (envDir do vite.config.ts); aqui
      # vem destas variáveis. São os valores públicos que vão em todo bundle servido
      # ao navegador: a chave de API web do Firebase não é segredo, o acesso é
      # controlado por Rules e backend. Em 09/10/2026 um build sem elas foi
      # publicado e o login parou com "Firebase não configurado"; por isso a trava
      # no fim do passo. Segredos de verdade (AGENT_DUTE_*) nunca entram aqui.
      - name: Install and build frontend
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDaoJ0a_ZScGJHEbwwvUPYvW7dRmPssPQw"
          VITE_FIREBASE_AUTH_DOMAIN: "dute-btg.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "dute-btg"
          VITE_FIREBASE_STORAGE_BUCKET: "dute-btg.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "912453685006"
          VITE_FIREBASE_APP_ID: "912453685006:web:38592b73c2d5569823d15f"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@workspace/btg-inventory" run build
          if ! grep -q "${VITE_FIREBASE_AUTH_DOMAIN}" artifacts/btg-inventory/dist/public/assets/*.js; then
            echo "::error::O build saiu sem a configuração do Firebase (VITE_FIREBASE_*); não vai subir."
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      # A imagem é montada aqui no runner e enviada direto ao Artifact Registry.
      # `gcloud builds submit` precisava do bucket dute-btg_cloudbuild e falhava
      # com "forbidden from accessing the bucket" mesmo com os papéis certos
      # (ver docs/deploy-manual.md); sem Cloud Build, bastam artifactregistry.writer
      # e run.admin, que a conta de serviço já tem.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image and deploy to Cloud Run
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/cloud-run-src"
          mkdir -p "${STAGE_DIR}/deploy/cloud-run"
          mkdir -p "${STAGE_DIR}/artifacts/btg-inventory/dist"
          cp Dockerfile "${STAGE_DIR}/"
          cp deploy/cloud-run/nginx.conf "${STAGE_DIR}/deploy/cloud-run/"
          cp -r artifacts/btg-inventory/dist/public "${STAGE_DIR}/artifacts/btg-inventory/dist/"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${SHORT_SHA}"

          docker build --tag "${IMAGE}" "${STAGE_DIR}"
          docker push "${IMAGE}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --project "${PROJECT_ID}"

          gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format "value(status.url)"

      # Em 09/10/2026, oito execuções seguidas deste job terminaram verdes sem mudar
      # o que a produção servia: todas imprimiram a mesma revisão
      # (dute-btg-app-00143-loc) e o app continuou no build de 08/10: o tráfego
      # estava preso nessa revisão e as novas ficaram com 0%. Por isso o
      # deploy só conta quando o index.html servido referencia os assets do build
      # que acabamos de montar; se não bater, o job falha e mostra o tráfego e as
      # últimas revisões do serviço para diagnóstico.
      - name: Verify production is serving this build
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          if ! bash tools/check_frontend_deployed.sh artifacts/btg-inventory/dist/public/index.html "${SERVICE_URL}" "${PUBLIC_URL}"; then
            echo "Tráfego e revisões do serviço:"
            gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
              --format "yaml(status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,spec.traffic)"
            gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 5 \
              --format "table(name,creationTimestamp.date('%Y-%m-%d %H:%M'),active,spec.containers[0].image)"
            exit 1
          fi

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs: [frontend-typecheck, functions-unit, functions-integration]
    # Mesmo gate do deploy-frontend: só main publica, push mergeado ou disparo manual.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-functions-production
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-btg
      REGION: southamerica-east1
      WORKLOAD_IDENTITY_PROVIDER: projects/912453685006/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-functions@dute-btg.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 02/10/2026: a API do Cloud Scheduler estava desligada e 4 callables novas
      # (rotinas do Agent Dute) ficaram com deploy falho — a onSchedule precisa
      # dela. Já está ativa em dute-btg hoje; isso é só rede de segurança pra um
      # projeto novo. 16/10/2026: a SA github-actions-functions não tem
      # serviceusage.services.enable (só serviceUsageConsumer, que é pra
      # *usar* serviço já ativo, não ativar um novo) — dar serviceUsageAdmin só
      # pra isso seria mais privilégio do que vale a pena; não trava o job se
      # falhar, o `firebase deploy` já falha sozinho se a API estiver desligada.
      - name: Garantir API do Cloud Scheduler ativa
        continue-on-error: true
        run: gcloud services enable cloudscheduler.googleapis.com --project "${{ env.PROJECT_ID }}"

      # Sempre o lote inteiro, nunca "firebase deploy --only functions:nome": foi
      # deploy parcial que causou o incidente de 03/09/2026 (8 callables sem
      # invoker, um mês sem ninguém perceber). Timeout de descoberta já subido de
      # cara — na máquina do Leonardo precisou de 60-180s dependendo do dia (ver
      # docs/deploy-functions-manual.md); o runner do CI é uma máquina
      # desconhecida, sem alguém olhando pra tentar de novo com um valor maior.
      # firebase.json fica na raiz do repo (não em functions/) — é de lá que o
      # firebase deploy precisa rodar, igual no roteiro manual.
      - name: Publicar todas as functions
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: "180"
        run: firebase deploy --only functions --project "${{ env.PROJECT_ID }}" --non-interactive

      # Não autocorrige — só falha e avisa. O incidente de 03/09/2026 ficou um mês
      # sem ninguém perceber justamente porque nada conferia isso depois do
      # deploy; o script sugere o "gcloud run services add-iam-policy-binding"
      # certo, mas quem aplica é uma pessoa (ver docs/deploy-functions-manual.md).
      - name: Verificar invocação pública de cada callable
        shell: pwsh
        run: ./tools/check_functions_invoker.ps1

  cloud-run-diagnostico:
    name: Diagnóstico do Cloud Run (só leitura)
    runs-on: ubuntu-latest
    # Disparo manual (Actions > CI > Run workflow), de qualquer branch. Mostra
    # geração, tráfego, template, revisões e o que as URLs servem, com a mesma
    # credencial do deploy. Não altera nada no serviço.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-btg
      REGION: southamerica-east1
      SERVICE: dute-btg-app
      PUBLIC_URL: https://app.dutelog.com.br
      WORKLOAD_IDENTITY_PROVIDER: projects/912453685006/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@dute-btg.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Serviço (geração, tráfego, template)
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format "yaml(metadata.generation,status.observedGeneration,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,spec.traffic,spec.template.metadata,spec.template.spec.containers[0].image,status.conditions)"

      - name: Revisões (15 mais recentes)
        run: |
          set -euo pipefail
          gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 15
          echo
          gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 15 \
            --format "table(name,creationTimestamp.date('%Y-%m-%d %H:%M:%S'),active,status.conditions[0].status,status.conditions[0].message,spec.containers[0].image)"

      - name: O que as URLs servem
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          for url in "${SERVICE_URL}" "${PUBLIC_URL}"; do
            echo "== ${url}"
            curl -sSI --max-time 20 "${url}/index.html" | grep -i -E "^(HTTP|last-modified|etag)" || true
            curl -sS --max-time 20 "${url}/index.html" | grep -o '/assets/shell-app-[^"]*\.js' || true
          done

  liberar-trafego:
    name: Mudar tráfego do serviço
    runs-on: ubuntu-latest
    # Só roda no disparo manual com "liberar_trafego" marcado. Muda a produção:
    # 100% do tráfego passa para a última revisão pronta do serviço. Reversível
    # com --to-revisions NOME=100 (ver docs/deploy-manual.md).
    if: github.event_name == 'workflow_dispatch' && inputs.liberar_trafego
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-btg
      REGION: southamerica-east1
      SERVICE: dute-btg-app
      PUBLIC_URL: https://app.dutelog.com.br
      WORKLOAD_IDENTITY_PROVIDER: projects/912453685006/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@dute-btg.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Tráfego antes
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format "yaml(spec.traffic,status.traffic,status.latestCreatedRevisionName,status.latestReadyRevisionName)"

      - name: Mudar o tráfego (100% para a revisão informada, ou para a última pronta)
        env:
          REVISAO: ${{ inputs.revisao }}
        run: |
          set -euo pipefail
          if [ -n "${REVISAO}" ]; then
            gcloud run services update-traffic "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --to-revisions "${REVISAO}=100"
          else
            gcloud run services update-traffic "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --to-latest
          fi

      - name: Tráfego depois e o que as URLs servem
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format "yaml(spec.traffic,status.traffic,status.latestCreatedRevisionName,status.latestReadyRevisionName)"
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          for url in "${SERVICE_URL}" "${PUBLIC_URL}"; do
            echo "== ${url}"
            curl -sSI --max-time 20 "${url}/index.html?after=release" | grep -i -E "^(HTTP|last-modified|etag)" || true
            curl -sS --max-time 20 "${url}/index.html?after=release" | grep -o '/assets/shell-app-[^"]*\.js' || true
          done
