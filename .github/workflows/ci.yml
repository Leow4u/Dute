name: CI

# Runner: variável de repositório RUNNER_LABEL (Settings → Secrets and
# variables → Actions → Variables). Vazia, o job com Playwright fica em
# ubuntu-24.04 (o 1.56.1 não sobe no ubuntu-latest 26.04) e o resto em
# ubuntu-latest. Um self-hosted entra nos dois sem editar este arquivo.
#
# A main roda a suíte inteira de novo. O merge deste repositório cria um
# commit novo ("Merge pull request"); o CI verde do PR é de outro SHA e não
# cobre o resultado do merge nem um push direto. A homologação só publica
# depois deste CI (workflow_run). Pular o CI da main, ou deixar só um smoke,
# publicaria um commit que a integração nunca viu.
#
# No PR, pushes novos cancelam o CI anterior (concurrency). Na main cada
# commit tem o próprio grupo: um não cancela o outro.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Disparo manual (Actions > CI > Run workflow): sempre roda o diagnóstico do
  # Cloud Run da produção. Marcar "publicar_producao" publica a main na produção.
  # Marcar "liberar_trafego" solta o tráfego do Cloud Run para a última revisão
  # pronta (--to-latest); é o que desfaz um rollback feito com --to-revisions.
  workflow_dispatch:
    inputs:
      publicar_producao:
        description: "Publicar a main na produção (app.dutelog.com.br): regras e índices, frontend e functions"
        type: boolean
        default: false
      liberar_trafego:
        description: "Mudar o tráfego do dute-app: 100% para a última revisão pronta (--to-latest), ou para a revisão informada abaixo"
        type: boolean
        default: false
      revisao:
        description: "Opcional, para rollback: nome da revisão que recebe 100% do tráfego (ex.: dute-app-00012-abc). Vazio = última revisão pronta."
        type: string
        default: ""

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checagens:
    name: Checagens (typecheck e unitários)
    # Playwright 1.56.1 suporta Ubuntu 24.04; ubuntu-latest já usa 26.04.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: artifacts/app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        working-directory: .
        run: pnpm install --frozen-lockfile
      # O typecheck do root roda tsc --build primeiro, gerando os .d.ts de
      # lib/api-client-react que o app referencia — sem isso o checkout limpo
      # do CI falha com TS6305 e uma cascata de implicit any.
      - name: Typecheck workspace
        working-directory: .
        run: pnpm run typecheck
      - name: Frontend unit tests
        run: pnpm run test
      - name: Verify institutional website
        working-directory: .
        run: |
          pnpm --filter @workspace/dutelog-site run test
          pnpm --filter @workspace/dutelog-site run build
          pnpm --filter @workspace/dutelog-site run test:build
      - name: Unitários do WMS
        working-directory: functions/wms
        run: npm ci && npm run test:unit
      - name: Testes do check_functions_invoker.ps1
        working-directory: .
        shell: pwsh
        run: ./tools/check_functions_invoker.tests.ps1
      - name: Testes do congelar_projeto.ps1
        working-directory: .
        shell: pwsh
        run: ./tools/congelar_projeto.tests.ps1
      - name: Testes do trocar_registro_a_hostinger.ps1
        working-directory: .
        shell: pwsh
        run: ./tools/trocar_registro_a_hostinger.tests.ps1
      - name: Unitários do Comercial
        working-directory: functions/comercial
        run: npm ci && npm run test:unit
      - name: Unitários da Operação
        working-directory: functions/operacao
        run: npm ci && npm run test:unit
      - name: Unitários do Financeiro
        working-directory: functions/financeiro
        run: npm ci && npm run test:unit
      - name: Unitários do núcleo
        working-directory: functions/core
        run: npm ci && npm run test:unit
      - name: Unitários do RH
        working-directory: functions/rh
        run: npm ci && npm run test:unit
      - name: Testes das ferramentas Python (tools/)
        working-directory: .
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Testes do padronizar-nomes (node --test)
        working-directory: .
        run: node --test "tools/padronizar-nomes/*.test.mjs"
      - name: Testes do corrigir-codigo-do-produto (node --test)
        working-directory: .
        run: node --test "tools/corrigir-codigo-do-produto/*.test.mjs"
      - name: Install Java (emulador do blog)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        working-directory: .
        run: npm install -g firebase-tools
      - name: Transações editoriais do Blog
        working-directory: artifacts/dutelog-site
        env:
          BLOG_TEST_FIRESTORE_PROJECT: demo-site-blog-tests
        run: firebase emulators:exec --project demo-site-blog-tests --config tests/firebase.json --only firestore "pnpm exec tsx --test tests/blog-repository.test.ts"
      # Só o Chromium, sem --with-deps: o runner já tem as bibliotecas (vem com
      # o Google Chrome), e o --with-deps baixava pelo apt fontes e xvfb que o
      # teste headless não usa. Em 22/10/2026 esse apt levou 12 min a 25 kB/s;
      # o download do Chromium leva uns 6 s.
      - name: Install isolated browser test tools
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/dute-browser-smoke" --no-audit --no-fund --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/dute-browser-smoke/node_modules/playwright/cli.js" install chromium
      - name: Build production frontend
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyBPaH5X0wHbF_geH1zit0rwyJWmdb3Q7Ds"
          VITE_FIREBASE_AUTH_DOMAIN: dute-homolog.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dute-homolog
          VITE_FIREBASE_STORAGE_BUCKET: dute-homolog.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "368642218894"
          VITE_FIREBASE_APP_ID: "1:368642218894:web:13790f72c76fbb21af22df"
        run: pnpm run build
      - name: Verify production bundle starts in Chromium
        working-directory: .
        run: |
          pnpm --filter @workspace/app exec vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/dute-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          SMOKE_TOOL_DIR="$RUNNER_TEMP/dute-browser-smoke" node tools/check_frontend_startup.cjs http://127.0.0.1:4173 "$RUNNER_TEMP/dute-startup-after"
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-startup
          path: |
            ${{ runner.temp }}/dute-startup-after
            ${{ runner.temp }}/dute-preview.log
          retention-days: 7

  integracao:
    name: Integração (emulador)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/wms/package-lock.json
            functions/comercial/package-lock.json
            functions/operacao/package-lock.json
            functions/financeiro/package-lock.json
            functions/core/package-lock.json
            functions/rh/package-lock.json
      - name: Install Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Dependências do WMS
        working-directory: functions/wms
        run: npm ci
      - name: Integração do WMS
        working-directory: functions/wms
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/registrar_consultas.cjs
          CONSULTAS_SAIDA: ${{ runner.temp }}/consultas-wms.jsonl
        run: npm run test:integration
      - name: Índice das consultas do WMS
        run: python3 tools/indices_das_consultas.py "${{ runner.temp }}/consultas-wms.jsonl"
      - name: Dependências do Comercial
        working-directory: functions/comercial
        run: npm ci
      - name: Integração do Comercial
        working-directory: functions/comercial
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/registrar_consultas.cjs
          CONSULTAS_SAIDA: ${{ runner.temp }}/consultas-comercial.jsonl
        run: npm run test:integration
      - name: Índice das consultas do Comercial
        run: python3 tools/indices_das_consultas.py "${{ runner.temp }}/consultas-comercial.jsonl"
      - name: Dependências da Operação
        working-directory: functions/operacao
        run: npm ci
      - name: Integração da Operação
        working-directory: functions/operacao
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/registrar_consultas.cjs
          CONSULTAS_SAIDA: ${{ runner.temp }}/consultas-operacao.jsonl
        run: npm run test:integration
      - name: Índice das consultas da Operação
        run: python3 tools/indices_das_consultas.py "${{ runner.temp }}/consultas-operacao.jsonl"
      - name: Dependências do Financeiro
        working-directory: functions/financeiro
        run: npm ci
      - name: Integração do Financeiro
        working-directory: functions/financeiro
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/registrar_consultas.cjs
          CONSULTAS_SAIDA: ${{ runner.temp }}/consultas-financeiro.jsonl
        run: npm run test:integration
      - name: Índice das consultas do Financeiro
        run: python3 tools/indices_das_consultas.py "${{ runner.temp }}/consultas-financeiro.jsonl"
      - name: Dependências do núcleo
        working-directory: functions/core
        run: npm ci
      - name: Integração do núcleo
        working-directory: functions/core
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/registrar_consultas.cjs
          CONSULTAS_SAIDA: ${{ runner.temp }}/consultas-core.jsonl
        run: npm run test:integration
      - name: Índice das consultas do núcleo
        run: python3 tools/indices_das_consultas.py "${{ runner.temp }}/consultas-core.jsonl"
      - name: Dependências do RH
        working-directory: functions/rh
        run: npm ci
      - name: Integração do RH
        working-directory: functions/rh
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/registrar_consultas.cjs
          CONSULTAS_SAIDA: ${{ runner.temp }}/consultas-rh.jsonl
        run: npm run test:integration
      - name: Índice das consultas do RH
        run: python3 tools/indices_das_consultas.py "${{ runner.temp }}/consultas-rh.jsonl"

  # A homologação não mora aqui. O homologacao.yml nasce quando este workflow
  # termina verde na main (workflow_run) e publica só o HEAD.

  # Produção só por disparo manual a partir da main, com "publicar_producao"
  # marcado. Desde o corte da Fase 1 (docs/plataforma/fase-1-corte.md) a
  # produção é o dute-prod; o dute-btg ficou congelado.
  publicar-producao:
    name: Publicar na produção
    needs: [checagens, integracao]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publicar_producao
    concurrency:
      group: publicar-producao
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publicar.yml
    with:
      ambiente: producao
      project_id: dute-prod
      project_number: "974421124970"
      service: dute-app
      repository: dute
      public_url: https://app.dutelog.com.br
      firebase_api_key: "AIzaSyAqA8X_nzaN145XHBbRbviSbXENw_fQkpw"
      firebase_app_id: "1:974421124970:web:e224e2335773655bde6713"

  cloud-run-diagnostico:
    name: Diagnóstico do Cloud Run (só leitura)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Disparo manual (Actions > CI > Run workflow), de qualquer branch. Mostra
    # geração, tráfego, template, revisões e o que as URLs servem, com a mesma
    # credencial do deploy. Não altera nada no serviço.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-prod
      REGION: southamerica-east1
      SERVICE: dute-app
      PUBLIC_URL: https://app.dutelog.com.br
      WORKLOAD_IDENTITY_PROVIDER: projects/974421124970/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@dute-prod.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Serviço (geração, tráfego, template)
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format "yaml(metadata.generation,status.observedGeneration,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic,spec.traffic,spec.template.metadata,spec.template.spec.containers[0].image,status.conditions)"

      - name: Revisões (15 mais recentes)
        run: |
          set -euo pipefail
          gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 15
          echo
          gcloud run revisions list --service "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --limit 15 \
            --format "table(name,creationTimestamp.date('%Y-%m-%d %H:%M:%S'),active,status.conditions[0].status,status.conditions[0].message,spec.containers[0].image)"

      - name: O que as URLs servem
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          for url in "${SERVICE_URL}" "${PUBLIC_URL}"; do
            echo "== ${url}"
            curl -sSI --max-time 20 "${url}/index.html" | grep -i -E "^(HTTP|last-modified|etag)" || true
            curl -sS --max-time 20 "${url}/index.html" | grep -o '/assets/shell-app-[^"]*\.js' || true
          done

  liberar-trafego:
    name: Mudar tráfego do serviço
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Só roda no disparo manual a partir da main, com "liberar_trafego" marcado.
    # Muda a produção: 100% do tráfego passa para a última revisão pronta do
    # serviço. Reversível com --to-revisions NOME=100 (ver docs/deploy-manual.md).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.liberar_trafego
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-prod
      REGION: southamerica-east1
      SERVICE: dute-app
      PUBLIC_URL: https://app.dutelog.com.br
      WORKLOAD_IDENTITY_PROVIDER: projects/974421124970/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@dute-prod.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Tráfego antes
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format "yaml(spec.traffic,status.traffic,status.latestCreatedRevisionName,status.latestReadyRevisionName)"

      - name: Mudar o tráfego (100% para a revisão informada, ou para a última pronta)
        env:
          REVISAO: ${{ inputs.revisao }}
        run: |
          set -euo pipefail
          if [ -n "${REVISAO}" ]; then
            gcloud run services update-traffic "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --to-revisions "${REVISAO}=100"
          else
            gcloud run services update-traffic "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --to-latest
          fi

      - name: Tráfego depois e o que as URLs servem
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" \
            --format "yaml(spec.traffic,status.traffic,status.latestCreatedRevisionName,status.latestReadyRevisionName)"
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format "value(status.url)")"
          for url in "${SERVICE_URL}" "${PUBLIC_URL}"; do
            echo "== ${url}"
            curl -sSI --max-time 20 "${url}/index.html?after=release" | grep -i -E "^(HTTP|last-modified|etag)" || true
            curl -sS --max-time 20 "${url}/index.html?after=release" | grep -o '/assets/shell-app-[^"]*\.js' || true
          done
