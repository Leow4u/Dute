name: CI

on:
  push:
    branches: [main, master, codex/ai-native-foundation]
  pull_request:

jobs:
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/btg-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace
        working-directory: .
        run: pnpm install --frozen-lockfile
      # O typecheck do root roda tsc --build primeiro, gerando os .d.ts de
      # lib/api-client-react que o app referencia — sem isso o checkout limpo
      # do CI falha com TS6305 e uma cascata de implicit any.
      - name: Typecheck workspace
        working-directory: .
        run: pnpm run typecheck
      - name: Frontend unit tests
        run: pnpm run test

  functions-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions deps
        run: npm ci
      - name: Unit tests
        run: npm run test:unit

  functions-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install functions deps
        run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Integration + rules tests
        run: npm run test:integration

  deploy-frontend:
    name: Deploy frontend (Cloud Run)
    runs-on: ubuntu-latest
    needs: [frontend-typecheck]
    if: github.event_name == 'push'
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: dute-btg
      REGION: southamerica-east1
      SERVICE: dute-btg-app
      REPOSITORY: dute-btg
      WORKLOAD_IDENTITY_PROVIDER: projects/912453685006/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: github-actions-deploy@dute-btg.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@workspace/btg-inventory" run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image and deploy to Cloud Run
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/cloud-run-src"
          mkdir -p "${STAGE_DIR}/deploy/cloud-run"
          mkdir -p "${STAGE_DIR}/artifacts/btg-inventory/dist"
          cp Dockerfile "${STAGE_DIR}/"
          cp deploy/cloud-run/nginx.conf "${STAGE_DIR}/deploy/cloud-run/"
          cp -r artifacts/btg-inventory/dist/public "${STAGE_DIR}/artifacts/btg-inventory/dist/"

          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${SHORT_SHA}"

          gcloud config set project "${PROJECT_ID}"
          gcloud builds submit "${STAGE_DIR}" --tag "${IMAGE}" --project "${PROJECT_ID}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --project "${PROJECT_ID}"

          gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format "value(status.url)"
