name: Deploy frontend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master, codex/ai-native-foundation]

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloud Run (app.dutelog.com.br)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    env:
      PROJECT_ID: dute-btg
      REGION: southamerica-east1
      SERVICE: dute-btg-app
      REPOSITORY: dute-btg
    steps:
      - name: Require GCP credentials secret
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Missing repository secret GCP_SA_KEY. Run tools/setup_github_deploy.ps1 once, then add the key to GitHub → Settings → Secrets → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@workspace/btg-inventory" run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build image and deploy to Cloud Run
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/cloud-run-src"
          mkdir -p "${STAGE_DIR}/deploy/cloud-run"
          mkdir -p "${STAGE_DIR}/artifacts/btg-inventory/dist"
          cp Dockerfile "${STAGE_DIR}/"
          cp deploy/cloud-run/nginx.conf "${STAGE_DIR}/deploy/cloud-run/"
          cp -r artifacts/btg-inventory/dist/public "${STAGE_DIR}/artifacts/btg-inventory/dist/"

          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${SHORT_SHA}"

          gcloud config set project "${PROJECT_ID}"
          gcloud builds submit "${STAGE_DIR}" --tag "${IMAGE}" --project "${PROJECT_ID}"
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --project "${PROJECT_ID}"

          gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format "value(status.url)"
